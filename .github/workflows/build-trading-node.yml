name: Build Trading Node Image
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    github.event.inputs.request_id != '' &&
    format('Build Trading Node Image ({0})', github.event.inputs.request_id) ||
    'Build Trading Node Image'
  }}

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/build-trading-node.yml'
      - '.docker/nautilus_trader.dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'build.py'
      - 'pyproject.toml'
      - 'rust-toolchain.toml'
      - 'uv.lock'
      - 'uv-version'
      - 'crates/**'
      - 'nautilus_trader/**'
      - 'python/**'
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional coordination id from an upstream deploy workflow.
        required: false
        type: string
      requesting_repository:
        description: Optional source repository dispatching this build.
        required: false
        type: string
      requesting_sha:
        description: Optional source commit requesting this build.
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Checkout signal-engine sources (quantchat-backend-rs)
        # Stages the signal-engine crates into the build context; the
        # Dockerfile builds the abi3 wheel from them (see the "signal engine"
        # step in .docker/nautilus_trader.dockerfile).
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: MandelTechnologies/quantchat-backend-rs
          token: ${{ secrets.REPOSITORY_ACCESS_TOKEN }}
          path: external/backend-rs
          sparse-checkout: crates
          persist-credentials: false

      - name: Set image name (lowercase)
        id: image
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trading-node"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "cache=${image_name}:buildcache" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        # https://github.com/jlumbroso/free-disk-space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        # https://github.com/docker/login-action
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Trading Node Image
        # https://github.com/docker/build-push-action
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: .docker/nautilus_trader.dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.cache }}
            type=gha
          cache-to: type=registry,ref=${{ steps.image.outputs.cache }},mode=max

      - name: Image details
        run: |
          echo "✅ Trading Node image built and pushed:"
          echo "   - ${{ steps.image.outputs.name }}:${{ github.sha }}"
          echo "   - ${{ steps.image.outputs.name }}:latest"
          echo ""
          echo "To use in production, set:"
          echo "   TRADING_NODE_IMAGE=${{ steps.image.outputs.name }}:latest"
